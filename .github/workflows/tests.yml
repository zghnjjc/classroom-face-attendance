name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest-windows:
    name: unittest (Windows, Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      CLASSROOM_DATA_DIR: ${{ runner.temp }}/classroom-unittest-data
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip check

      - name: Tk smoke test
        run: python -c "import tkinter as tk; r = tk.Tk(); r.withdraw(); r.destroy(); print('Tk OK')"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

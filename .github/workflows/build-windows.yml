name: build-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      CLASSROOM_DATA_DIR: ${{ runner.temp }}/classroom-build-tests
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell 5.1 script encoding
        shell: powershell
        run: |
          foreach ($script in @('tools/build_windows.ps1', 'tools/create_shortcuts.ps1')) {
            $path = (Resolve-Path -LiteralPath $script).Path
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 3 -or [BitConverter]::ToString($bytes[0..2]) -ne 'EF-BB-BF') {
              throw "$script must use UTF-8 with BOM."
            }
            $text = [System.IO.File]::ReadAllText($path)
            if ([regex]::IsMatch($text, '(?<!\r)\n')) {
              throw "$script must use CRLF line endings."
            }
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and self-test package
        shell: pwsh
        run: ./tools/build_windows.ps1 -Python (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomAttendance-Windows-x64-preview
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 14
